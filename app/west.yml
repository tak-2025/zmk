manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tak-2025
      url-base: https://github.com/tak-2025
  projects:
    - name: zephyr
      remote: zmkfirmware
      revision: v3.5.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: nanopb
      revision: 8c60555d6277a0360c876bd85d491fc4fb0cd74a
      path: modules/lib/nanopb
      remote: zmkfirmware
    # torabo.proto (the settings tunnel) lives in this fork; upstream has no
    # field for it, and ZMK_RPC_SUBSYSTEM needs the generated tag to exist.
    # Tracks the branch rather than a commit so the two forks move together.
    - name: zmk-studio-messages
      revision: dev
      path: modules/msgs/zmk-studio-messages
      remote: tak-2025
  self:
    west-commands: scripts/west-commands.yml
